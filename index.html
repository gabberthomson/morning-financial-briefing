<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122139"><meta name="description" content="Morning Financial Briefing"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Morning Financial Briefing</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#101c2d;color:#eaf2fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#101c2d,#162e48)}header,main,footer{max-width:1040px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(23px,5vw,36px);margin:8px 0}h2{font-size:clamp(19px,4vw,30px);margin:4px 0 18px}small,.sub{color:#adbed2}button,a.btn{font:inherit;color:white;background:#254d75;border:1px solid #52789c;border-radius:12px;padding:10px 16px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #5bbaff}button:disabled{opacity:.35}a{color:#85cfff}section{background:#1b3049;padding:clamp(16px,4vw,30px);border-radius:22px;min-height:380px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:#233e5d;padding:15px;border-radius:13px;min-width:0}.card strong{font-size:clamp(20px,5vw,34px);display:block;color:#ff9f9f}.card span{font-size:12px;color:#b8cadc;display:block}.bad{color:#ffaaaa}.good{color:#7de6b5}table{border-collapse:collapse;width:100%;font-size:clamp(11px,2.5vw,15px)}th,td{padding:10px 5px;text-align:left;border-bottom:1px solid #49617a}th{color:#b6cfe5}tr td:nth-child(n+2){font-variant-numeric:tabular-nums}nav{display:flex;gap:12px;align-items:center;justify-content:center;padding:16px}nav button{min-width:65px}#detail{margin-top:20px;display:none;background:#223f5d;border-radius:12px;padding:16px}.source{margin-top:15px;color:#c5d6ea}.source a{display:inline-block;margin:5px 12px 5px 0}footer{color:#aabed1;font-size:12px}@media(max-width:520px){.cards{gap:6px}.card{padding:9px}.card strong{font-size:21px}.card span{font-size:10px}section{min-height:450px}header{flex-wrap:wrap}}
#progress-track{height:4px;background:#294461;border-radius:5px;overflow:hidden;max-width:1040px;margin:0 auto 5px}#progress-fill{height:100%;width:14.285%;background:#62baf5;transition:width .32s ease}section{animation:fadeIn .3s ease} @keyframes fadeIn{from{opacity:.55;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.rate-note{margin-top:14px;background:#25425e;padding:14px;border-left:3px solid #5ab9ff;border-radius:8px}.rate-table th:not(:first-child),.rate-table td:not(:first-child){text-align:right}.rate-table td{white-space:nowrap}.rate-table{min-width:610px}.pill{display:inline-block;border:1px solid #4a7494;border-radius:50px;padding:5px 12px;font-size:12px;color:#9edaff;margin-bottom:12px}#ratechart{width:100%;height:auto;max-height:370px}.curve-controls{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.curve-controls button{font-size:12px;padding:7px 10px}.curve-controls button.selected{background:#397ab2;border-color:#86ccff}.toggle-rates{margin-bottom:12px}.feature{background:#233f5b;border-radius:12px;padding:13px;margin:10px 0;border-left:3px solid #5caef5}.certificate{border:1px solid #49617b;border-radius:12px;padding:14px;margin:10px 0}.certificate .isin{font-family:monospace;color:#8bd0fa;letter-spacing:.4px}.warning{color:#dcbf8b;font-size:12px}</style></head><body><header><div><small>MORNING MARKETS</small><h1>Financial Briefing</h1><div class="sub">Giovedì 8 ottobre 2026 · Edizione dimostrativa</div></div><button id="subscribe" type="button">Attiva notifiche</button></header><div id="progress-track"><div id="progress-fill"></div></div><main><section aria-live="polite"><small id="topic"></small><h2 id="heading"></h2><div id="content"></div><div id="detail"></div><div id="sources" class="source"></div></section><nav><button id="prev" aria-label="Indietro">←</button><strong id="counter"></strong><button id="next" aria-label="Avanti">→</button></nav></main><footer>Le quotazioni sono quelle del briefing dimostrativo dell'8 ottobre 2026 e non si aggiornano in tempo reale. Le notifiche richiedono un backend Web Push, non ancora configurato.</footer>
<script>
const tbl=(heads,rows)=>'<div style="overflow-x:auto"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
const links=(items)=>items.map(x=>'<a href="'+x[1]+'" target="_blank" rel="noopener noreferrer">'+x[0]+' ↗</a>').join('');
const slides=[
{topic:'01 · EXECUTIVE SUMMARY',heading:'I driver della giornata',html:'<div class="cards"><div class="card"><span>USA · S&P 500</span><strong>−0,22%</strong><span>7.801,77</span></div><div class="card"><span>EUROPA · FTSE MIB</span><strong>−2,51%</strong><span>49.972,25</span></div><div class="card"><span>ASIA · NIKKEI</span><strong>−0,92%</strong><span>70.035,71</span></div></div><div class="feature"><b>Energia → inflazione → tassi.</b> Le tensioni nel Golfo alimentano il rischio di shock sulle forniture: con il Brent intorno a 100 $/barile, gli investitori rivalutano persistenza dell’inflazione e margini di manovra delle banche centrali.</div><div class="feature"><b>Rischio fiscale francese → spread → banche.</b> L’incertezza sul bilancio francese penalizza gli OAT rispetto ai Bund; un costo di finanziamento più alto e la volatilità dei titoli sovrani pesano sul sentiment bancario europeo.</div><div class="feature"><b>Duration → equity.</b> Rendimenti lunghi elevati aumentano il tasso di sconto dei flussi futuri, comprimendo le valutazioni dei settori più sensibili ai tassi. L’Europa ha mostrato un calo più intenso di Wall Street.</div><div class="feature"><b>MPS → rischio evento.</b> L’offerta migliorata di Intesa e la posizione degli azionisti possono incidere su aspettative di concambio, governance e strategia; distinguere comunicati ufficiali e indiscrezioni.</div><p class="warning">Analisi dei possibili canali di trasmissione, non attribuzione causale certa a ogni movimento di mercato.</p>',sources:[['Financial Times','https://www.ft.com/'],['Reuters','https://www.reuters.com/'],['Sole 24 Ore','https://www.ilsole24ore.com/']]},
{topic:'02 · GEOPOLITICA',heading:'Energia, inflazione e rischio sovrano',html:'<p>Le tensioni in Medio Oriente mantengono elevato il rischio energetico. In Europa il debito francese continua a essere sotto osservazione per l’incertezza fiscale.</p><button id="expand" type="button">Approfondisci</button>',detail:'Il canale di trasmissione è rappresentato da prezzi energetici, aspettative d’inflazione e premi di rischio sui governativi.',sources:[['Reuters','https://www.reuters.com/'],['Il Sole 24 Ore','https://www.ilsole24ore.com/']]},
{topic:'03 · TASSI',heading:'Curve dei rendimenti',html:'<div class="pill">7 ottobre 2026 · rendimenti %</div><div class="toggle-rates"><button id="switch-rates" type="button">📈 Mostra grafico</button></div><div id="rates-table"><div style="overflow-x:auto">'+tbl(['Curva','5Y','10Y','Δ5Y sett.','Δ10Y sett.','5s10s'],[['EUR IRS','3,468%','3,591%','−11,7 bp','−7,5 bp','+12,3 bp'],['USD SOFR','4,758%','4,894%','−4,3 bp*','−0,2 bp*','+13,6 bp'],['BTP','4,030%','4,643%','−0,5 bp','+0,3 bp','+61,3 bp'],['Treasury','5,03%','5,27%','—','—','+24,0 bp'],['Bund','3,202%','3,4805%','−13,1 bp','−9,8 bp','+27,9 bp'],['OAT','4,180%','4,896%','+0,3 bp','+3,4 bp','+71,6 bp']])+'</div></div><div id="rates-graph" hidden><div class="curve-controls" id="curve-controls"></div><svg id="ratechart" role="img" aria-label="Curva rendimenti da 3 a 10 anni; nodi 3 e 7 interpolati" viewBox="0 0 740 365"></svg><p class="warning">Nodi 3Y e 7Y = interpolazione lineare indicativa dei nodi 5Y e 10Y, <b>non quotazioni rilevate</b>. 3Y è estrapolazione: solo illustrativa. Nessun dato di mercato inventato.</p></div><div class="rate-note"><b>EUR IRS: bull steepening</b><p>5s10s +4,2 bp nella settimana. Spread 10Y BTP–Bund ≈116,3 bp; OAT–Bund ≈141,6 bp.</p><button id="expand" type="button">Approfondisci</button></div><small>* SOFR Δ dal 1 ottobre; altre curve dal 30 settembre, Treasury Δ non validati.</small>',detail:'Il rialzo della pendenza può derivare dal calo più rapido dei rendimenti brevi (bull steepening) oppure dall’aumento più rapido dei lunghi (bear steepening). I nodi 3Y e 7Y necessitano di dati reali dedicati per usi quantitativi.',sources:[['EUR IRS','https://www.investing.com/rates-bonds/eur-10-years-irs-interest-rate-swap-historical-data'],['SOFR','https://axiom-capital.com/rate-watch/'],['Treasury','https://www.federalreserve.gov/releases/h15/'],['Bund','https://www.investing.com/rates-bonds/germany-10-year-bond-yield-historical-data'],['OAT','https://www.investing.com/rates-bonds/france-10-year-bond-yield-historical-data']]},
{topic:'04 · EQUITY',heading:'Chiusure USA, Europa e Asia',html:tbl(['Indice','Δ giorno','Livello'],[['S&P 500','−0,22%','7.801,77'],['Nasdaq','−0,22%','27.538,69'],['Euro Stoxx 50','−1,47%','6.180,29'],['FTSE MIB','−2,51%','49.972,25'],['Nikkei 225','−0,92%','70.035,71'],['Hang Seng','−0,62%','24.130,50']])+'<p>Ultime chiusure disponibili per ciascun mercato, senza forzare omogeneità fra fusi orari.</p>',sources:[['FT Markets','https://markets.ft.com/'],['Investing.com','https://www.investing.com/indices/major-indices']]},
{topic:'05 · COMMODITIES',heading:'Brent, oro e PUN',html:tbl(['Strumento','Livello','Unità'],[['Brent','100,20','USD/bbl'],['Oro spot','4.108,36','USD/oz'],['PUN Index*','200,11','EUR/MWh']])+'<p><small>* PUN da fonte secondaria; riconciliazione con GME ancora necessaria.</small></p>',sources:[['GME','https://www.mercatoelettrico.org/'],['Oro Investing.com','https://it.investing.com/currencies/xau-usd-historical-data']]},
{topic:'06 · MPS',heading:'Operazioni straordinarie',html:'<p>Resta in primo piano l’offerta migliorata di Intesa Sanpaolo su MPS e il posizionamento dei principali azionisti.</p>',sources:[['Comunicazione Intesa','https://group.intesasanpaolo.com/it/investor-relations/comunicati-stampa-price-sensitive/2026/10/20261003-mps-it'],['FT','https://www.ft.com/content/0d3884be-a2c4-4914-a0a2-f22af8ef3857']]},
{topic:'07 · CERTIFICATI',heading:'Strutture da monitorare',html:'<div class="certificate"><span class="isin">GB00BW8VFZ83</span><h3>Goldman Sachs · Airbag Autocallable Cash Collect</h3><p>Premi mensili fissi; rimborso anticipato dal nono mese; barriera airbag a scadenza al 50%. <b>Spunto:</b> premio incondizionato vs rischio di perdita sul worst-of alla scadenza.</p><a href="https://www.goldman-sachs.it/prodotti/gb00bw8vfz83/" target="_blank" rel="noopener noreferrer">Scheda dell’emittente ↗</a></div><div class="certificate"><span class="isin">GB00BTV52T91</span><h3>Goldman Sachs · Airbag con memoria</h3><p>Worst-of MPS, Intesa e Stellantis; premio condizionato trimestrale 3,50% e memoria; airbag al 60%. <b>Spunto:</b> trade-off fra cedola elevata e concentrazione del paniere.</p><a href="https://www.goldman-sachs.it/prodotti/gb00btv52t91/" target="_blank" rel="noopener noreferrer">Scheda dell’emittente ↗</a></div><div class="certificate"><span class="isin">GB00BW8VHP26</span><h3>Goldman Sachs · Callable Cash Collect</h3><p>Worst-of MPS, Banco BPM e BPER; premio mensile 0,85%, barriera finale 50%. <b>Spunto:</b> analisi del rischio di richiamo e del reinvestimento.</p><a href="https://www.goldman-sachs.it/certificati-callable-cash-collect-giugno-2026/" target="_blank" rel="noopener noreferrer">Emissione e payoff ↗</a></div><p class="warning">Esempi verificabili, non necessariamente nuove innovazioni dell’ottobre 2026. Non costituiscono raccomandazioni.</p>',sources:[['Goldman Sachs – Airbag','https://www.goldman-sachs.it/certificati-autocallable-cash-collect-airbag-ottobre-2025/'],['Certificati e Derivati','https://www.certificatiederivati.it/'],['Société Générale','https://prodotti.societegenerale.it/']]}
];
const curves=[{name:'EUR IRS',a:3.468,b:3.591},{name:'USD SOFR',a:4.758,b:4.894},{name:'BTP',a:4.030,b:4.643},{name:'Treasury',a:5.03,b:5.27},{name:'Bund',a:3.202,b:3.4805},{name:'OAT',a:4.180,b:4.896}];let curveIndex=0,graphMode=false;
function paintCurve(){const c=curves[curveIndex],terms=[3,5,7,10],vals=terms.map(t=>c.a+(c.b-c.a)*(t-5)/5),min=Math.min(...vals)-.15,max=Math.max(...vals)+.15,svg=document.getElementById('ratechart');if(!svg)return;const px=t=>62+(t-3)/7*620,py=v=>300-(v-min)/(max-min)*244;let parts=['<rect width="740" height="365" fill="#1b3049"/>'];for(let k=0;k<5;k++){let val=min+(max-min)*k/4,y=py(val);parts.push('<line x1="62" y1="'+y+'" x2="692" y2="'+y+'" stroke="#3f5a75" stroke-dasharray="3 5"/>','<text x="6" y="'+(y+4)+'" fill="#b4cbe2" font-size="13">'+val.toFixed(2)+'%</text>')}const points=terms.map((t,i)=>px(t)+','+py(vals[i])).join(' ');parts.push('<polyline points="'+points+'" fill="none" stroke="#57baff" stroke-width="3"/>');terms.forEach((t,i)=>{const actual=t===5||t===10;parts.push('<circle cx="'+px(t)+'" cy="'+py(vals[i])+'" r="6" fill="'+(actual?'#57baff':'#1b3049')+'" stroke="#83d5ff" stroke-width="2"/>','<text x="'+px(t)+'" y="333" text-anchor="middle" fill="#d5e7f9" font-size="14">'+t+'Y</text>','<text x="'+px(t)+'" y="'+(py(vals[i])-12)+'" text-anchor="middle" fill="#d5e7f9" font-size="13">'+vals[i].toFixed(3)+(actual?'%':'%*')+'</text>')});svg.innerHTML=parts.join('');document.getElementById('curve-controls').innerHTML=curves.map((x,i)=>'<button type="button" data-c="'+i+'" class="'+(curveIndex===i?'selected':'')+'">'+x.name+'</button>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{curveIndex=Number(b.dataset.c);paintCurve()})}
function wireRates(){const b=document.getElementById('switch-rates');if(!b)return;b.onclick=()=>{graphMode=!graphMode;document.getElementById('rates-table').hidden=graphMode;document.getElementById('rates-graph').hidden=!graphMode;b.textContent=graphMode?'▤ Mostra tabella':'📈 Mostra grafico';if(graphMode)paintCurve()}}
let pos=0;function draw(){const s=slides[pos];document.getElementById('topic').textContent=s.topic;document.getElementById('heading').textContent=s.heading;document.getElementById('content').innerHTML=s.html;document.getElementById('sources').innerHTML='<b>Fonti e approfondimenti</b><div>'+links(s.sources)+'</div>';document.getElementById('detail').style.display='none';document.getElementById('detail').textContent=s.detail||'';document.getElementById('counter').textContent=(pos+1)+' / '+slides.length;document.getElementById('progress-fill').style.width=((pos+1)/slides.length*100)+'%';document.getElementById('prev').disabled=pos===0;document.getElementById('next').disabled=pos===slides.length-1;wireRates();let b=document.getElementById('expand');if(b)b.onclick=()=>{document.getElementById('detail').style.display='block'}}
document.getElementById('prev').onclick=()=>{pos--;draw()};document.getElementById('next').onclick=()=>{pos++;draw()};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&pos>0){pos--;draw()}if(e.key==='ArrowRight'&&pos<slides.length-1){pos++;draw()}});draw();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
const PUSH_API=''; // Inserire indirizzo workers.dev dopo deploy del Worker (vedere push-worker/README.md)
function toBytes(v){const x=atob(v.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-v.length%4)%4));return Uint8Array.from(x,c=>c.charCodeAt(0))}
document.getElementById('subscribe').onclick=async()=>{const b=document.getElementById('subscribe');if(!PUSH_API){alert('Il backend Cloudflare Web Push è pronto nel repository ma deve ancora essere pubblicato e configurato.');return;}try{if(!('PushManager'in window)||!('serviceWorker'in navigator))throw Error('Push non supportato su questo dispositivo');const cfg=await fetch(PUSH_API+'/api/config').then(r=>{if(!r.ok)throw Error('Backend non disponibile');return r.json()});const perm=await Notification.requestPermission();if(perm!=='granted')throw Error('Permesso notifiche non concesso');const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:toBytes(cfg.vapidPublicKey)});const res=await fetch(PUSH_API+'/api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(sub.toJSON())});if(!res.ok)throw Error('Salvataggio sottoscrizione non riuscito');b.textContent='Notifiche attive';}catch(e){alert(e.message)}};
</script></body></html>
