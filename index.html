dow strong{color:#b7e1ff}body.modal-open{overflow:hidden}/* Motion and touch navigation */ section{touch-action:pan-y;overflow:hidden;will-change:transform,opacity}section.scene-enter-next{animation:sceneNext .42s cubic-bezier(.2,.8,.2,1) both}section.scene-enter-prev{animation:scenePrev .42s cubic-bezier(.2,.8,.2,1) both}@keyframes sceneNext{from{opacity:0;transform:translateX(38px) scale(.985)}to{opacity:1;transform:translateX(0) scale(1)}}@keyframes scenePrev{from{opacity:0;transform:translateX(-38px) scale(.985)}to{opacity:1;transform:translateX(0) scale(1)}}section .card{animation:cardRise .5s both;box-shadow:0 6px 20px #06132633;transition:transform .25s,box-shadow .25s}section .card:nth-child(2){animation-delay:.07s}section .card:nth-child(3){animation-delay:.14s}@keyframes cardRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}.card:hover{transform:translateY(-4px);box-shadow:0 12px 24px #06132666}.feature,.certificate{animation:featureAppear .42s both}.feature:nth-child(2),.certificate:nth-child(2){animation-delay:.06s}.feature:nth-child(3),.certificate:nth-child(3){animation-delay:.12s}@keyframes featureAppear{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:translateY(0)}}.modal-backdrop{animation:backdropIn .2s ease both}.modal-window{animation:modalIn .28s cubic-bezier(.18,.8,.24,1) both}@keyframes backdropIn{from{opacity:0}to{opacity:1}}@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}#progress-fill{transition:width .45s cubic-bezier(.2,.8,.2,1)}#ratechart polyline,#ratechart line[stroke="#57baff"]{animation:chartReveal .65s ease both}@keyframes chartReveal{from{opacity:.1}to{opacity:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><header><div><small>MORNING MARKETS</small><h1>Financial Briefing</h1><div class="sub">Giovedì 8 ottobre 2026 · Edizione dimostrativa</div></div><button id="subscribe" type="button">Attiva notifiche</button><div id="push-status" role="status" aria-live="polite"></div></header><div id="progress-track"><div id="progress-fill"></div></div><main><section aria-live="polite"><small id="topic"></small><h2 id="heading"></h2><div id="content"></div><div id="detail"></div><div id="sources" class="source"></div></section><nav><button id="prev" aria-label="Indietro">←</button><strong id="counter"></strong><button id="next" aria-label="Avanti">→</button></nav></main><div id="modal-root"></div><footer>Le quotazioni sono quelle del briefing dimostrativo dell'8 ottobre 2026 e non si aggiornano in tempo reale. Notifiche facoltative tramite Web Push; puoi disattivarle dal pulsante in alto.</footer>

const slides=[
{topic:'01 · EXECUTIVE SUMMARY',heading:'I driver della giornata',html:'<div class="cards"><div class="card"><span>USA · S&P 500</span><strong>−0,22%</strong><span>7.801,77</span></div><div class="card"><span>EUROPA · FTSE MIB</span><strong>−2,51%</strong><span>49.972,25</span></div><div class="card"><span>ASIA · NIKKEI</span><strong>−0,92%</strong><span>70.035,71</span></div></div><div class="feature"><b>Energia → inflazione → tassi.</b> Le tensioni nel Golfo alimentano il rischio di shock sulle forniture: con il Brent intorno a 100 $/barile, gli investitori rivalutano persistenza dell’inflazione e margini di manovra delle banche centrali.</div><div class="feature"><b>Rischio fiscale francese → spread → banche.</b> L’incertezza sul bilancio francese penalizza gli OAT rispetto ai Bund; un costo di finanziamento più alto e la volatilità dei titoli sovrani pesano sul sentiment bancario europeo.</div><div class="feature"><b>Duration → equity.</b> Rendimenti lunghi elevati aumentano il tasso di sconto dei flussi futuri, comprimendo le valutazioni dei settori più sensibili ai tassi. L’Europa ha mostrato un calo più intenso di Wall Street.</div><div class="feature"><b>MPS → rischio evento.</b> L’offerta migliorata di Intesa e la posizione degli azionisti possono incidere su aspettative di concambio, governance e strategia; distinguere comunicati ufficiali e indiscrezioni.</div><p class="warning">Analisi dei possibili canali di trasmissione, non attribuzione causale certa a ogni movimento di mercato.</p>',sources:[['Financial Times','https://www.ft.com/'],['Reuters','https://www.reuters.com/'],['Sole 24 Ore','https://www.ilsole24ore.com/']]},
{topic:'02 · GEOPOLITICA',heading:'Energia, inflazione e rischio sovrano',html:'<p>Le tensioni in Medio Oriente mantengono elevato il rischio energetico. In Europa il debito francese continua a essere sotto osservazione per l’incertezza fiscale.</p>',detail:'Il canale di trasmissione è rappresentato da prezzi energetici, aspettative d’inflazione e premi di rischio sui governativi.',sources:[['Reuters','https://www.reuters.com/'],['Il Sole 24 Ore','https://www.ilsole24ore.com/']]},
{topic:'03 · TASSI',heading:'Curve dei rendimenti',html:'<div class="pill">7 ottobre 2026 · rendimenti %</div><div style="overflow-x:auto">'+tbl(['Curva','5Y','10Y','Δ5Y sett.','Δ10Y sett.','5s10s'],[['EUR IRS','3,468%','3,591%','−11,7 bp','−7,5 bp','+12,3 bp'],['USD SOFR','4,758%','4,894%','−4,3 bp*','−0,2 bp*','+13,6 bp'],['BTP','4,030%','4,643%','−0,5 bp','+0,3 bp','+61,3 bp'],['Treasury','5,03%','5,28%','—','—','+25,0 bp'],['Bund','3,202%','3,4805%','−13,1 bp','−9,8 bp','+27,9 bp'],['OAT','4,180%','4,896%','+0,3 bp','+3,4 bp','+71,6 bp']])+'</div><div class="rate-note"><b>EUR IRS: bull steepening</b><p>5s10s +4,2 bp nella settimana. Spread 10Y BTP–Bund ≈116,3 bp; OAT–Bund ≈141,6 bp.</p></div><small>* SOFR Δ dal 1 ottobre; altre curve dal 30 settembre, Treasury Δ non validati.</small>',detail:'Il rialzo della pendenza può derivare dal calo più rapido dei rendimenti brevi (bull steepening) oppure dall’aumento più rapido dei lunghi (bear steepening). Sono riportati solo i nodi 5Y e 10Y, con variazioni settimanali e pendenza 5s10s.',sources:[['EUR IRS','https://www.investing.com/rates-bonds/eur-10-years-irs-interest-rate-swap-historical-data'],['SOFR','https://axiom-capital.com/rate-watch/'],['Treasury','https://www.federalreserve.gov/releases/h15/'],['Bund','https://www.investing.com/rates-bonds/germany-10-year-bond-yield-historical-data'],['OAT','https://www.investing.com/rates-bonds/france-10-year-bond-yield-historical-data']]},
{topic:'04 · EQUITY',heading:'Chiusure USA, Europa e Asia',html:tbl(['Indice','Δ giorno','Livello'],[['S&P 500','−0,22%','7.801,77'],['Nasdaq','−0,22%','27.538,69'],['Euro Stoxx 50','−1,47%','6.180,29'],['FTSE MIB','−2,51%','49.972,25'],['Nikkei 225','−0,92%','70.035,71'],['Hang Seng','−0,62%','24.130,50']])+'<p>Ultime chiusure disponibili per ciascun mercato, senza forzare omogeneità fra fusi orari.</p>',sources:[['FT Markets','https://markets.ft.com/'],['Investing.com','https://www.investing.com/indices/major-indices']]},
{topic:'05 · COMMODITIES',heading:'Brent, oro e PUN',html:tbl(['Strumento','Livello','Unità'],[['Brent','100,20','USD/bbl'],['Oro spot','4.108,36','USD/oz'],['PUN Index*','200,11','EUR/MWh']])+'<p><small>* PUN da fonte secondaria; riconciliazione con GME ancora necessaria.</small></p>',sources:[['GME','https://www.mercatoelettrico.org/'],['Oro Investing.com','https://it.investing.com/currencies/xau-usd-historical-data']]},
{topic:'06 · MPS',heading:'Operazioni straordinarie',html:'<p>Resta in primo piano l’offerta migliorata di Intesa Sanpaolo su MPS e il posizionamento dei principali azionisti.</p>',sources:[['Comunicazione Intesa','https://group.intesasanpaolo.com/it/investor-relations/comunicati-stampa-price-sensitive/2026/10/20261003-mps-it'],['FT','https://www.ft.com/content/0d3884be-a2c4-4914-a0a2-f22af8ef3857']]},
{topic:'07 · CERTIFICATI',heading:'Strutture da monitorare',html:'<div class="certificate"><span class="isin">GB00BW8VFZ83</span><h3>Goldman Sachs · Airbag Autocallable Cash Collect</h3><p>Premi mensili fissi; rimborso anticipato dal nono mese; barriera airbag a scadenza al 50%. <b>Spunto:</b> premio incondizionato vs rischio di perdita sul worst-of alla scadenza.</p><a href="https://www.goldman-sachs.it/prodotti/gb00bw8vfz83/" target="_blank" rel="noopener noreferrer">Scheda dell’emittente ↗</a></div><div class="certificate"><span class="isin">GB00BTV52T91</span><h3>Goldman Sachs · Airbag con memoria</h3><p>Worst-of MPS, Intesa e Stellantis; premio condizionato trimestrale 3,50% e memoria; airbag al 60%. <b>Spunto:</b> trade-off fra cedola elevata e concentrazione del paniere.</p><a href="https://www.goldman-sachs.it/prodotti/gb00btv52t91/" target="_blank" rel="noopener noreferrer">Scheda dell’emittente ↗</a></div><div class="certificate"><span class="isin">GB00BW8VHP26</span><h3>Goldman Sachs · Callable Cash Collect</h3><p>Worst-of MPS, Banco BPM e BPER; premio mensile 0,85%, barriera finale 50%. <b>Spunto:</b> analisi del rischio di richiamo e del reinvestimento.</p><a href="https://www.goldman-sachs.it/certificati-callable-cash-collect-giugno-2026/" target="_blank" rel="noopener noreferrer">Emissione e payoff ↗</a></div><p class="warning">Esempi verificabili, non necessariamente nuove innovazioni dell’ottobre 2026. Non costituiscono raccomandazioni.</p>',sources:[['Goldman Sachs – Airbag','https://www.goldman-sachs.it/certificati-autocallable-cash-collect-airbag-ottobre-2025/'],['Certificati e Derivati','https://www.certificatiederivati.it/'],['Société Générale','https://prodotti.societegenerale.it/']]}
];
const details=[
{title:'Executive summary · catena causale',body:'<div class="feature"><strong>1. Shock energetico e tassi</strong><p>La minaccia alle rotte del greggio introduce un premio di rischio sul Brent. Se l’aumento persiste, sostiene l’inflazione headline e limita la possibilità di allentamento monetario. I rendimenti possono salire, soprattutto dove domina il rischio d’inflazione; attenzione però agli effetti opposti di una frenata della crescita.</p></div><div class="feature"><strong>2. Francia e repricing del credito sovrano</strong><p>Le tensioni fiscali spingono gli investitori a richiedere premio di rischio sugli OAT, favorendo relativamente il Bund. Lo spread può trasmettersi al costo del funding e al mark-to-market dei portafogli bancari.</p></div><div class="feature"><strong>3. Equity e duration</strong><p>Quando cresce il rendimento richiesto sui bond, aumenta il discount rate. A utili attesi invariati, diminuisce il valore attuale dei flussi azionari, specie per duration lunga. La relazione non è meccanica: profitti, settori e risk appetite contano.</p></div><div class="feature"><strong>4. MPS e rischio operazione</strong><p>Le condizioni proposte, le posizioni degli azionisti e la probabilità percepita dell’operazione modificano la valorizzazione relativa delle azioni coinvolte. Utilizzare prima di tutto i comunicati societari.</p></div>'},
{title:'Geopolitica · canali di trasmissione',body:'<p>Il mercato guarda alla persistenza dello shock energetico: un prezzo elevato del petrolio può peggiorare bilance commerciali dei paesi importatori, comprimere i margini delle imprese energivore e complicare la disinflazione. L’intensità dell’effetto dipende da durata, cambio e capacità di sostituzione dell’offerta.</p><p>Il debito francese riflette una seconda fonte di rischio: deficit, offerta di emissioni e capacità politica di adottare misure fiscali. Gli investitori confrontano il premio richiesto sugli OAT con il Bund tedesco come riferimento a minor rischio.</p>'},
{title:'Curve dei tassi · lettura operativa',body:'<p><strong>Livello e pendenza sono informazioni differenti.</strong> Una discesa dei 5Y maggiore dei 10Y produce bull steepening; una salita dei 10Y maggiore dei 5Y produce bear steepening. Per gli swap conta inoltre il fixing floating (Euribor 6M o SOFR) e la convenzione di quotazione.</p><p><strong>Nodi 3Y e 7Y:</strong> il Treasury dispone di quotazioni giornaliere CMT ufficiali; per le altre curve al momento non sono state validate serie coerenti alla data, quindi il grafico lascia n.d. Non si forzano valori interpolati e non si uniscono segmenti che attraversano maturità mancanti.</p><p><strong>Rischio sovrano:</strong> OAT–Bund e BTP–Bund misurano il differenziale dei 10Y; occorre usare titoli e timestamp coerenti per calcoli di rischio.</p>'},
{title:'Equity · lettura dei movimenti',body:'<p>La chiusura dei listini europei è stata più debole di quella statunitense. Una componente può essere l’esposizione a banche e titoli domestici in un contesto di volatilità dei governativi. Per gli Stati Uniti la pressione dei rendimenti lunghi colpisce il costo del capitale; in Asia i movimenti vanno letti alla luce dei fusi orari e del momento effettivo della chiusura.</p><p>Le percentuali sono confronti con la seduta precedente del mercato locale: non rappresentano performance simultanee.</p>'},
{title:'Commodities · effetti di secondo ordine',body:'<p><strong>Brent:</strong> rialzo persistente significa maggiori costi energetici, possibile pressione sui margini industriali e aumento del rischio di inflazione. Le aspettative sulla risposta monetaria possono amplificare la volatilità dei bond.</p><p><strong>Oro:</strong> il prezzo riflette insieme tassi reali, dollaro e domanda di protezione; non è una copertura perfetta nel breve termine.</p><p><strong>PUN:</strong> è necessario il riscontro sul dato ufficiale GME, separando valore giornaliero e media mensile.</p>'},
{title:'MPS · scenari da seguire',body:'<p>Monitorare comunicati price-sensitive, scadenze dell’operazione, eventuali revisioni dei termini e dichiarazioni dei principali azionisti. Le implicazioni di prezzo dipendono da condizioni economiche, probabilità di completamento e possibili sinergie.</p><p>Per i desk strutturazione e risk management occorre valutare l’effetto su volatilità implicita, correlazioni e rischio di gap dei sottostanti.</p>'},
{title:'Certificati · meccanica e rischi',body:'<div class="feature"><strong>Airbag</strong><p>Riduce la perdita a scadenza rispetto a una partecipazione lineare solo al verificarsi delle condizioni previste; non garantisce il capitale. Conta il livello della barriera e la formula applicata al peggior sottostante.</p></div><div class="feature"><strong>Coupon con memoria</strong><p>Premi precedentemente non corrisposti possono essere recuperati a una successiva osservazione favorevole; non si tratta di redditi certi e l’effetto dipende dal percorso del sottostante.</p></div><div class="feature"><strong>Callable / autocall</strong><p>Il rimborso anticipato limita la vita effettiva del prodotto e crea rischio di reinvestimento. Distinguere facoltà discrezionale dell’emittente da condizione di autocall automatica.</p></div><p>Gli ISIN delle schede rimandano alle pagine emittente: consultare sempre condizioni definitive, composizione del paniere, barriera e ranking creditizio.</p>'}
];
function openDetail(){const d=details[pos],root=document.getElementById('modal-root');root.innerHTML='<div class="modal-backdrop" id="modal-backdrop"><div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><button id="modal-close" class="modal-close" aria-label="Chiudi approfondimento">×</button><h2 id="modal-title">'+d.title+'</h2>'+d.body+'<hr style="border:0;border-top:1px solid #49617b;margin:20px 0"><strong>Fonti</strong><div>'+links(slides[pos].sources)+'</div></div></div>';document.body.classList.add('modal-open');document.getElementById('modal-close').onclick=closeDetail;document.getElementById('modal-backdrop').onclick=e=>{if(e.target.id==='modal-backdrop')closeDetail()};document.getElementById('modal-close').focus()}
function closeDetail(){document.getElementById('modal-root').innerHTML='';document.body.classList.remove('modal-open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('modal-open'))closeDetail()});
let pos=0,lastDirection=1;function draw(){const s=slides[pos];const scene=document.querySelector('main section');scene.classList.remove('scene-enter-next','scene-enter-prev');void scene.offsetWidth;scene.classList.add(lastDirection>=0?'scene-enter-next':'scene-enter-prev');document.getElementById('topic').textContent=s.topic;document.getElementById('heading').textContent=s.heading;document.getElementById('content').innerHTML=s.html;document.getElementById('sources').innerHTML='<button id="read-more" type="button">Approfondisci ↗</button><div><b>Fonti e approfondimenti</b></div><div>'+links(s.sources)+'</div>';document.getElementById('read-more').onclick=openDetail;document.getElementById('detail').style.display='none';document.getElementById('detail').textContent=s.detail||'';document.getElementById('counter').textContent=(pos+1)+' / '+slides.length;document.getElementById('progress-fill').style.width=((pos+1)/slides.length*100)+'%';document.getElementById('prev').disabled=pos===0;document.getElementById('next').disabled=pos===slides.length-1}
function moveSlide(delta){if(document.body.classList.contains('modal-open'))return;const next=pos+delta;if(next<0||next>=slides.length)return;lastDirection=delta;pos=next;draw()}document.getElementById('prev').onclick=()=>moveSlide(-1);document.getElementById('next').onclick=()=>moveSlide(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')moveSlide(-1);if(e.key==='ArrowRight')moveSlide(1)});let touchStart=null;const swipeArea=document.querySelector('main section');swipeArea.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const el=e.target;if(el.closest('button,a,input,select,textarea,#rates-graph'))return;touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY,time:Date.now()}},{passive:true});swipeArea.addEventListener('touchend',e=>{if(!touchStart||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>=55&&Math.abs(dx)>Math.abs(dy)*1.35)moveSlide(dx<0?1:-1)},{passive:true});swipeArea.addEventListener('touchcancel',()=>{touchStart=null},{passive:true});draw();
</script><script src="./push-client.js?v=4" defer></script></body></html>
